<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ptsasset:">
  <title>Workshop Manual</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <aside id="toc">
    <div class="toc-head">
      <div class="book" id="book-title">Workshop Manual</div>
      <input id="search" type="search" placeholder="Search the contents… (Ctrl+K)" autocomplete="off" spellcheck="false">
      <label id="vin-filter" class="vin-filter" hidden title="Hide the procedures for other engines, transmissions and options">
        <input id="vin-only" type="checkbox" checked> Only this vehicle <span id="vin-note" class="muted"></span>
      </label>
    </div>
    <div id="tree" class="tree"></div>
    <div id="toc-resize" title="Drag to resize"></div>
  </aside>

  <section id="main">
    <div id="doctabs">
      <button id="btn-toc" class="icon" title="Show or hide the contents">☰</button>
      <div id="tabs"></div>
    </div>
    <div id="doc-bar" hidden>
      <button id="btn-back" class="ghost small" title="Back to where you were in this procedure" disabled>‹ Back</button>
      <span id="doc-where" class="where"></span>
      <button id="btn-expand" class="ghost small" title="Show or hide every pinpoint test step" hidden>Collapse steps</button>
      <button id="btn-print" class="ghost small" title="Print this procedure">🖨 Print</button>
    </div>
    <div id="content"></div>
  </section>

  <div id="zoom" hidden><img alt=""></div>

  <!-- the viewer's code, in viewer/: shared pieces first, viewer.js last (it starts the page). viewer/common.js says what each file does. -->
  <script src="viewer/common.js"></script>
  <script src="viewer/contents.js"></script>
  <script src="viewer/vehicle-filter.js"></script>
  <script src="viewer/search.js"></script>
  <script src="viewer/documents.js"></script>
  <script src="viewer/procedure.js"></script>
  <script src="viewer/pinpoints.js"></script>
  <script src="viewer/viewer.js"></script>
</body>
</html>
