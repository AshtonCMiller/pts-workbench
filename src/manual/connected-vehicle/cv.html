<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ptsasset:">
  <title>Connected Vehicle</title>
  <link rel="stylesheet" href="../viewer.css">
  <link rel="stylesheet" href="../oasis/oasis.css">
  <link rel="stylesheet" href="../diagnostics/diag.css">
  <link rel="stylesheet" href="cv.css">
</head>
<!-- The vehicle's connected vehicle data from Ford: Home (status and health history), over-the-air updates, software subscriptions -->
<body class="oasis diag cv">
  <header class="o-head">
    <div>
      <div class="o-title">Connected Vehicle</div>
      <div class="o-sub" id="cv-sub"></div>
    </div>
    <div class="o-actions">
      <button id="btn-refresh" class="ghost small" title="Ask Ford for the latest again">↻ Refresh</button>
      <button id="btn-ford" class="ghost small" title="Open Ford's own page for this as a tab">Ford's page</button>
    </div>
  </header>
  <nav id="cv-tabs" class="d-tabs">
    <button class="d-tab" data-view="home">Home</button>
    <button class="d-tab" data-view="ota">Over-the-air updates</button>
    <button class="d-tab" data-view="subs">Software</button>
  </nav>
  <main id="cv-body"></main>
  <div id="o-toast" class="o-toast" hidden></div>
  <!-- in this order: shared helpers first, cv.js last (it starts the page). common.js says what each file does. -->
  <script src="common.js"></script>
  <script src="dtcs.js"></script>
  <script src="home.js"></script>
  <script src="ota.js"></script>
  <script src="subscriptions.js"></script>
  <script src="cv.js"></script>
</body>
</html>
