# Builds PTS Workbench (the Rust app) on Windows and publishes it: on prodealer.works (where the app updates from)
# and as a GitHub release.
#
#   main branch  → a regular release, whenever Cargo.toml's [workspace.package] version is new
#                  (pushes that keep the same version just skip the build). Everyone gets it.
#   other branch → a BETA release on every push: version like 0.5.1-beta.57, marked "Pre-release" on GitHub.
#                  Only computers with Settings → "Beta updates" turned on install it.
#
# Each release has:
#   pts-workbench.exe, pts-workbench-app.exe,   the program files, which the new app updates itself with
#   pts-signin.exe, pdfium.dll, workbench.json  (workbench.json: each one's size and SHA-256; crates/app/src/updates.rs)
#   pts-vci32.exe                               Diagnostics' helper: 32-bit, to load Ford's 32-bit VCI driver
#   PTS-Workbench-Setup-<version>.exe           the installer: per-user, no admin (installer/pts-workbench.nsi)
#   app-bundle.asar, app-bundle.json,           for computers still on the Electron app: its usual update files, so
#   latest.yml, beta.yml                        it moves itself over to the new app (handoff/, scripts/release-files.js)
name: Build and release

on:
  push:
    branches: ['**']
  workflow_dispatch: # "Run workflow" button on GitHub, for a manual retry

permissions:
  contents: write # create releases and upload the files
  id-token: write # code signing: signs in to Azure without a stored password (OpenID Connect)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # (Azure trusts this environment's builds for code signing, whichever branch they're from: see "Sign the program
    # files")
    environment: release
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Windows Defender scans every file the compiler writes: off for this throwaway build machine, builds go much quicker
      - name: Speed up the build machine
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          BASE="${BASE%%-*}"
          if [ -z "$BASE" ]; then echo "::error::No version in Cargo.toml's [workspace.package]"; exit 1; fi
          if [ "${{ github.ref_name }}" = "main" ]; then
            NUMBER="$BASE"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            if gh release view "v$BASE" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::v$BASE is already released. Raise the version in Cargo.toml to publish a new one."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # A beta must count as newer than the regular version it's based on:
            # if v$BASE is already out, the beta is for the next patch (0.5.0 out → 0.5.1-beta.N)
            if gh release view "v$BASE" > /dev/null 2>&1; then
              IFS=. read -r MAJ MIN PAT <<< "$BASE"
              BASE="$MAJ.$MIN.$((PAT + 1))"
            fi
            NUMBER="$BASE-beta.${{ github.run_number }}"
            echo "beta=true" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Beta build v$NUMBER from branch ${{ github.ref_name }}"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "numeric=$BASE" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # Diagnostics' helper (pts-vci32) is 32-bit: Ford's VCI drivers are
          rustup target add i686-pc-windows-msvc
          rustc --version

      # Compiled crates kept between builds (only rebuilding what changed): named from Cargo.toml / Cargo.lock as
      # committed, before the version is set below, so the next build finds this one exactly (and doesn't save it again)
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false'
        with:
          shared-key: release
          cache-on-failure: true

      # Only for this build (not committed): the version every crate (and so the launcher and the app) is built with
      - name: Set the version v${{ steps.version.outputs.number }}
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          sed -i '/^\[workspace.package\]/,/^\[/ s/^version *= *"[^"]*"/version = "${{ steps.version.outputs.number }}"/' Cargo.toml
          grep -A3 '^\[workspace.package\]' Cargo.toml

      - name: Build
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          cargo build --workspace --exclude vci-bridge --release
          cargo build -p vci-bridge --release --target i686-pc-windows-msvc
          cp target/i686-pc-windows-msvc/release/pts-vci32.exe target/release/

      - name: Gather the program files
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          # PDFium is put beside the app by crates/app/build.rs; if that didn't happen, it's fetched here
          if [ ! -f target/release/pdfium.dll ]; then
            echo "::warning::pdfium.dll wasn't put beside the app by the build; downloading it"
            for try in 1 2 3; do
              curl -fsSL -o pdfium.tgz https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz && break
              sleep 15
            done
            mkdir -p pdfium && tar -xzf pdfium.tgz -C pdfium
            cp pdfium/bin/pdfium.dll target/release/
          fi
          mkdir -p dist/app
          for f in pts-workbench.exe pts-workbench-app.exe pts-signin.exe pdfium.dll pts-vci32.exe; do
            if [ ! -f "target/release/$f" ]; then echo "::error::target/release/$f wasn't built"; exit 1; fi
            cp "target/release/$f" dist/app/
          done
          ls -la dist/app

      # Code signing, with Azure Artifact Signing: every program file and the installer carry a signature with the
      # name it was validated under, so Windows (Smart App Control, SmartScreen) and antivirus programs know where they
      # came from and that nobody changed them. Signed before the installer packs them, and before workbench.json
      # records their SHA-256 (signing changes the files).
      #
      # Turned on by these repository variables (GitHub: Settings › Secrets and variables › Actions › Variables):
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID   the app registration that signs, and where it is
      #   ARTIFACT_SIGNING_ENDPOINT   the account's region, e.g. https://eus.codesigning.azure.net/
      #   ARTIFACT_SIGNING_ACCOUNT    the Artifact Signing account's name
      #   ARTIFACT_SIGNING_PROFILE    its certificate profile's name
      # The app registration has a federated credential for this repository's "release" environment (no password
      # kept anywhere) and the "Artifact Signing Certificate Profile Signer" role on the account. Without the
      # variables, builds go on unsigned.
      - name: Check code signing status
        if: steps.version.outputs.exists == 'false'
        id: signing
        shell: bash
        run: |
          if [ -n "${{ vars.ARTIFACT_SIGNING_ACCOUNT }}" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not code-signed: the ARTIFACT_SIGNING_* repository variables aren't set yet (see the comment above this step)."
          fi

      - name: Sign in to Azure (for code signing)
        if: steps.version.outputs.exists == 'false' && steps.signing.outputs.on == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the program files
        if: steps.version.outputs.exists == 'false' && steps.signing.outputs.on == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\app
          files-folder-filter: exe,dll
          file-digest: SHA256
          # (the signing certificate lasts three days; the timestamp keeps the signature good after that)
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The installer maker, kept between builds (installing it takes a while)
      - name: Reuse the installer maker
        if: steps.version.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-${{ runner.os }}-1

      - name: Make the installer
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then
            choco install nsis -y --no-progress
          fi
          "$MAKENSIS" -V3 \
            "-DVERSION=${{ steps.version.outputs.number }}" \
            "-DNUMVER=${{ steps.version.outputs.numeric }}" \
            "-DSRC=$(cygpath -w "$PWD/dist/app")" \
            "-DICON=$(cygpath -w "$PWD/assets/icon.ico")" \
            "-DOUT=$(cygpath -w "$PWD/dist/PTS-Workbench-Setup-${{ steps.version.outputs.number }}.exe")" \
            installer/pts-workbench.nsi

      - name: Sign the installer
        if: steps.version.outputs.exists == 'false' && steps.signing.outputs.on == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\PTS-Workbench-Setup-${{ steps.version.outputs.number }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Every file really is signed (and the signature checks out), or nothing is released
      - name: Check the signatures
        if: steps.version.outputs.exists == 'false' && steps.signing.outputs.on == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/app -File) + @(Get-ChildItem dist -Filter *.exe -File)
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($f.Name) isn't signed properly: $($sig.Status) $($sig.StatusMessage)"
              $bad++
            } else {
              Write-Host "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
            }
          }
          if ($bad) { exit 1 }

      # (22: what Wrangler 4 wants, for putting the release on prodealer.works)
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Make the update files
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
          TAG: v${{ steps.version.outputs.number }}
          REPO: ${{ github.repository }}
        run: node scripts/release-files.js

      # A draft until every file is up, so nothing finds a release that's half there
      - name: Create the release (a draft for now)
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # (a re-run of a failed build reuses the draft it already made)
        run: |
          TAG="v${{ steps.version.outputs.number }}"
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          if [ "${{ steps.version.outputs.beta }}" = "true" ]; then
            gh release create "$TAG" --draft --prerelease --target "${{ github.sha }}" \
              --title "$TAG (beta)" \
              --notes "Beta build from branch \`${{ github.ref_name }}\` (${{ github.sha }}). Installed only by computers with **Beta updates** turned on in Settings. New computers: download **PTS-Workbench-Setup-${{ steps.version.outputs.number }}.exe** and run it (no admin needed)."
          else
            gh release create "$TAG" --draft --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes "New computers: download **PTS-Workbench-Setup-${{ steps.version.outputs.number }}.exe** and run it (no admin needed). Computers with PTS Workbench already update by themselves."
          fi

      - name: Upload the files
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release upload "v${{ steps.version.outputs.number }}" --clobber \
            app/pts-workbench.exe app/pts-workbench-app.exe app/pts-signin.exe app/pdfium.dll app/pts-vci32.exe \
            "PTS-Workbench-Setup-${{ steps.version.outputs.number }}.exe" \
            app-bundle.asar app-bundle.json latest.yml beta.yml workbench.json

      # Where the app updates from (crates/app/src/updates.rs, sync-server/src/releases.js): the files into the R2
      # bucket, then the channel's workbench.json last, so the app only sees the release once every file is there.
      # Needs the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the sync server's deploy.
      - name: Put the release on prodealer.works
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          TAG: v${{ steps.version.outputs.number }}
          SETUP: PTS-Workbench-Setup-${{ steps.version.outputs.number }}.exe
        run: |
          cd dist
          put() { # <file> <key in the bucket> <type>
            for try in 1 2 3; do
              # (--remote: Wrangler 4 otherwise only puts it in a local test copy of the bucket)
              npx --yes wrangler@4 r2 object put "pts-releases/$2" --file "$1" --content-type "$3" --remote && return 0
              echo "::warning::Uploading $2 failed (try $try of 3)"
              sleep 15
            done
            echo "::error::Couldn't put $2 in the pts-releases bucket. Check the CLOUDFLARE_API_TOKEN secret has 'Account · Workers R2 Storage · Edit', and that the sync server has been deployed once since the bucket was added (it makes the bucket)."
            exit 1
          }
          for f in app/pts-workbench.exe app/pts-workbench-app.exe app/pts-signin.exe app/pdfium.dll app/pts-vci32.exe "$SETUP"; do
            put "$f" "releases/$TAG/$(basename "$f")" application/octet-stream
          done
          put workbench.json "releases/$TAG/workbench.json" application/json
          if [ "${{ steps.version.outputs.beta }}" = "true" ]; then CHANNEL=beta; else CHANNEL=latest; fi
          put workbench.json "channels/$CHANNEL/workbench.json" application/json
          echo "::notice::$TAG is on prodealer.works ($CHANNEL)"

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.version.outputs.beta }}" = "true" ]; then
            gh release edit "v${{ steps.version.outputs.number }}" --draft=false --prerelease
          else
            gh release edit "v${{ steps.version.outputs.number }}" --draft=false --latest
          fi

      # A release that couldn't be finished: its draft goes, so drafts don't pile up (nothing installs drafts)
      - name: Clean up a failed release
        if: failure() && steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.number }}" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v${{ steps.version.outputs.number }}" --yes
          fi

  # The tests, beside the release (they don't hold it back): a failure shows as a red ✗ on the push in GitHub
  test:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Speed up the build machine
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        shell: bash
        env:
          PTS_NO_PDFIUM: '1' # (tests don't need the PDF engine)
        run: cargo test --workspace
