# Deploys the sync server to your Cloudflare account whenever sync-server/ changes.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README).
name: Deploy sync server

on:
  push:
    branches: [main]
    paths:
      - 'sync-server/**'
      - '.github/workflows/sync-server.yml'
  workflow_dispatch:

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Create the database (first time only)
        shell: bash
        run: |
          find_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try { const db = JSON.parse(s).find((d) => d.name === "pts-sync"); process.stdout.write(db ? db.uuid : ""); } catch {}
              });'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            npx wrangler d1 create pts-sync
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "::error::Couldn't create or find the pts-sync database. Check the API token's D1 permission."; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "Database: $ID"

      - name: Set up the table
        run: npx wrangler d1 execute pts-sync --remote --file schema.sql

      - name: Deploy
        run: npx wrangler deploy
