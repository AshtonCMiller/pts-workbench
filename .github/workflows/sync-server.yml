# Deploys the sync server to your Cloudflare account whenever sync-server/ changes.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README).
# Optional third: REPORTS_ADMIN_KEY, the password for reading Feedback (bug reports / feature ideas) in the app.
name: Deploy sync server

on:
  push:
    branches: [main]
    paths:
      - 'sync-server/**'
      - '.github/workflows/sync-server.yml'
  workflow_dispatch:

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      # The website (web/, Vue + Vite), built into site/ next to the phone page, which goes out with the deploy
      - name: Build the website
        working-directory: sync-server/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la ../site ../site/assets

      - name: Check Cloudflare access
        run: npx wrangler whoami

      - name: Create the database (first time only)
        shell: bash
        run: |
          # Shows wrangler's own error if anything fails, instead of stopping silently
          list_dbs() {
            if ! npx wrangler d1 list --json > dbs.json 2> dbs.err; then
              echo "::error::Couldn't list your Cloudflare D1 databases. wrangler said:"
              cat dbs.err
              echo "::error::Usually the API token is missing 'Account · D1 · Edit', or CLOUDFLARE_ACCOUNT_ID is wrong."
              exit 1
            fi
          }
          find_id() {
            node -e '
              const fs = require("fs");
              const text = fs.readFileSync("dbs.json", "utf8");
              const a = text.indexOf("["), b = text.lastIndexOf("]");
              let list = [];
              try { list = JSON.parse(text.slice(a, b + 1)); } catch {}
              const db = list.find((d) => d.name === "pts-sync");
              process.stdout.write(db ? (db.uuid || db.id || "") : "");'
          }
          list_dbs
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Creating the pts-sync database…"
            if ! npx wrangler d1 create pts-sync; then
              echo "::error::Couldn't create the database (see wrangler's message above)."
              exit 1
            fi
            list_dbs
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then
            echo "::error::The pts-sync database wasn't found after creating it. wrangler's list output:"
            cat dbs.json
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "Database: $ID"

      - name: Set up the table
        run: npx wrangler d1 execute pts-sync --remote --file schema.sql

      # Columns added after the table was first made (schema.sql only makes missing tables). Each is added once;
      # after that SQLite says it's already there, which is fine.
      - name: Add newer columns
        shell: bash
        run: |
          add() {
            if npx wrangler d1 execute pts-sync --remote --command "ALTER TABLE reports ADD COLUMN $1" > add.log 2>&1; then
              echo "Added: $1"
            elif grep -qi "duplicate column" add.log; then
              echo "Already there: $1"
            else
              cat add.log; exit 1
            fi
          }
          add "fixed_in TEXT NOT NULL DEFAULT ''"

      # Where the desktop app's releases are kept (src/releases.js): made the first time
      - name: Create the releases bucket (first time only)
        shell: bash
        run: |
          if out="$(npx wrangler r2 bucket create pts-releases 2>&1)"; then
            echo "$out"
            exit 0
          fi
          echo "$out"
          if echo "$out" | grep -qiE "already exists|10004"; then
            echo "The bucket is already there."
            exit 0
          fi
          echo "::error::Couldn't make the R2 bucket for the app's releases. Usually R2 isn't turned on for the account yet (Cloudflare dashboard → R2 Object Storage), or the API token is missing 'Account · Workers R2 Storage · Edit'."
          exit 1

      - name: Deploy
        run: npx wrangler deploy

      - name: Set the Feedback admin key
        env:
          REPORTS_ADMIN_KEY: ${{ secrets.REPORTS_ADMIN_KEY }}
        shell: bash
        run: |
          if [ -z "$REPORTS_ADMIN_KEY" ]; then
            echo "::warning::No REPORTS_ADMIN_KEY secret: people can send feedback, but nobody can read it in the app yet."
            exit 0
          fi
          printf '%s' "$REPORTS_ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
