[package]
name = "vci"
description = "Talking to vehicles through a J2534 VCI: what the app and its 32-bin helper says to each other, Ford's modules, reading UDS answers, the network test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# app's side: starting the helper and asking it things
client = ["dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "sync"] }
