[package]
name = "launcher"
description = "Starts PTS Workbench: picks the newest working app version (downloaded updates, or the installed one)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The installed program people start. Kept small: it's never replaced by an update, only by the installer.
[[bin]]
name = "pts-workbench"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

# The loading window (Windows only): the plain Windows API, so the launcher stays small
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
