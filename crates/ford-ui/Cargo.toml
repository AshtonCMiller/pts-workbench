[package]
name = "ford-ui"
description = "Ford (PTS) Interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# For Ford / PTS Data interfacing
ford.workspace = true
# For shared UI libraries (animations, smooth transitions, etc.)
ui-kit.workspace = true
# For UI Drawing
iced.workspace = true
# For data parsing
chrono.workspace = true
tokio.workspace = true
# PDFs drawn as pages (pdf.rs): PDFium.
pdfium-render.workspace = true
# wiring diagrams drawn (paper.rs): reads and re-draws ford's SVG pages
resvg = "0.45"
